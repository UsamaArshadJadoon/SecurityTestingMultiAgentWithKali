<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Agent Directory - 31 Specialized Agents</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0d1929 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3.5em;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: -1px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .subtitle {
            font-size: 1.3em;
            color: #94a3b8;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        /* Search & Filter */
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.3s both;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            color: #f1f5f9;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            background: rgba(30, 41, 59, 1);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #00d4ff;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(0, 212, 255, 0.3);
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: #00d4ff;
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            transform: translateY(-2px);
        }

        /* Agent Grid */
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .agent-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(30, 41, 59, 0.7) 100%);
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease-out both;
        }

        .agent-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .agent-card:hover::before {
            left: 100%;
        }

        .agent-card:nth-child(1) { animation-delay: 0.05s; }
        .agent-card:nth-child(2) { animation-delay: 0.1s; }
        .agent-card:nth-child(3) { animation-delay: 0.15s; }
        .agent-card:nth-child(4) { animation-delay: 0.2s; }
        .agent-card:nth-child(5) { animation-delay: 0.25s; }
        .agent-card:nth-child(6) { animation-delay: 0.3s; }
        .agent-card:nth-child(7) { animation-delay: 0.35s; }
        .agent-card:nth-child(8) { animation-delay: 0.4s; }

        .agent-card:hover {
            border-color: #00d4ff;
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 20px 50px rgba(0, 212, 255, 0.3);
            background: linear-gradient(135deg, rgba(30, 41, 59, 1) 0%, rgba(30, 41, 59, 0.9) 100%);
        }

        .agent-header {
            display: flex;
            align-items: start;
            gap: 15px;
            margin-bottom: 15px;
        }

        .agent-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .agent-info {
            flex: 1;
        }

        .agent-id {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #00d4ff;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .agent-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #f1f5f9;
            margin-bottom: 3px;
        }

        .agent-phase {
            font-size: 0.8em;
            color: #94a3b8;
            background: rgba(0, 212, 255, 0.1);
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .agent-description {
            color: #cbd5e1;
            font-size: 0.95em;
            margin: 15px 0;
            line-height: 1.5;
        }

        .agent-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .tool-tag {
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid rgba(0, 212, 255, 0.4);
            color: #00d4ff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            transition: all 0.3s ease;
        }

        .agent-card:hover .tool-tag {
            background: rgba(0, 212, 255, 0.3);
            border-color: #00d4ff;
        }

        /* Statistics */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
            padding: 30px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 15px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
            animation: countUp 2s ease-out;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.95em;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes countUp {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .agents-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
            font-size: 1.1em;
        }

        .no-results svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🔍 Interactive Agent Directory</h1>
            <p class="subtitle">Explore 31 specialized penetration testing agents</p>
        </header>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-number">31</div>
                <div class="stat-label">Total Agents</div>
            </div>
            <div class="stat">
                <div class="stat-number">13</div>
                <div class="stat-label">Sequential Phases</div>
            </div>
            <div class="stat">
                <div class="stat-number">100%</div>
                <div class="stat-label">OWASP Coverage</div>
            </div>
            <div class="stat">
                <div class="stat-number">55+</div>
                <div class="stat-label">Tools Integrated</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔎</span>
                <input type="text" id="searchInput" placeholder="Search agents by name or ID...">
            </div>
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">All Agents</button>
                <button class="filter-btn" data-filter="surface">Surface Testing</button>
                <button class="filter-btn" data-filter="exploitation">Exploitation</button>
                <button class="filter-btn" data-filter="post">Post-Exploitation</button>
            </div>
        </div>

        <!-- Agents Grid -->
        <div class="agents-grid" id="agentsGrid">
            <!-- Populated by JavaScript -->
        </div>

        <div class="no-results" id="noResults" style="display: none;">
            <p>No agents found matching your criteria.</p>
        </div>
    </div>

    <script>
        const agents = [
            { id: 'RECON-001', name: 'Reconnaissance Agent', phase: 'Phase 1', category: 'recon', icon: '🔍', description: 'Passive & active reconnaissance, asset discovery, fingerprinting', tools: ['nmap', 'whois', 'dig', 'shodan'] },
            { id: 'WEB-002', name: 'Web Pentest Agent', phase: 'Phase 2', category: 'surface', icon: '🌐', description: 'OWASP Top 10 testing, SQLi, XSS, CSRF, path traversal', tools: ['burp', 'sqlmap', 'ffuf', 'nuclei'] },
            { id: 'API-003', name: 'API Security Agent', phase: 'Phase 2', category: 'surface', icon: '⚙️', description: 'REST, GraphQL, SOAP testing, BOLA, mass assignment', tools: ['postman', 'graphql-core', 'burp'] },
            { id: 'AUTH-004', name: 'Auth/AuthZ Agent', phase: 'Phase 2', category: 'surface', icon: '🔐', description: 'Login flows, JWT, OAuth, IDOR, privilege escalation', tools: ['jwt_tool', 'burp', 'hashcat'] },
            { id: 'INFRA-005', name: 'Infrastructure Agent', phase: 'Phase 2', category: 'surface', icon: '🏗️', description: 'Port scanning, service enumeration, TLS/SSL analysis', tools: ['nmap', 'testssl', 'nikto'] },
            { id: 'CLOUD-006', name: 'Cloud/Container Agent', phase: 'Phase 2', category: 'surface', icon: '☁️', description: 'AWS, GCP, Azure, Docker, Kubernetes config review', tools: ['aws-cli', 'gcloud', 'docker'] },
            { id: 'LLM-007', name: 'AI/LLM Agent', phase: 'Phase 2', category: 'surface', icon: '🤖', description: 'Prompt injection, jailbreak, RAG poisoning testing', tools: ['custom-payloads', 'manual-testing'] },
            { id: 'SSRF-008', name: 'SSRF Exploitation', phase: 'Phase 3', category: 'exploitation', icon: '🎯', description: 'Server-side request forgery chaining and exploitation', tools: ['burp', 'custom-payloads'] },
            { id: 'SMUGGLE-009', name: 'Request Smuggling', phase: 'Phase 3', category: 'exploitation', icon: '📨', description: 'HTTP/2 smuggling, CL.TE attacks', tools: ['burp', 'http2smuggler'] },
            { id: 'FILE-010', name: 'File Upload & RCE', phase: 'Phase 3', category: 'exploitation', icon: '📤', description: 'Polyglot files, shell upload, code execution', tools: ['exiftool', 'custom-shells'] },
            { id: 'POSTEX-015', name: 'Post-Exploitation', phase: 'Phase 4', category: 'post', icon: '📈', description: 'System enumeration, data harvesting, privilege escalation', tools: ['metasploit', 'mimikatz', 'linpeas'] },
            { id: 'PRIV-016', name: 'Privilege Escalation', phase: 'Phase 4', category: 'post', icon: '⬆️', description: 'Linux/Windows kernel exploits, misconfigurations', tools: ['linpeas', 'winpeas', 'metasploit'] },
            { id: 'SECRETS-017', name: 'Secrets Harvesting', phase: 'Phase 4', category: 'post', icon: '🔑', description: 'Credential extraction, API key discovery', tools: ['truffleHog', 'ripgrep'] },
            { id: 'LATERAL-018', name: 'Lateral Movement', phase: 'Phase 4', category: 'post', icon: '↔️', description: 'Network pivoting, SMB exploitation, trust abuse', tools: ['impacket', 'metasploit'] },
        ];

        const grid = document.getElementById('agentsGrid');
        const searchInput = document.getElementById('searchInput');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const noResults = document.getElementById('noResults');

        let currentFilter = 'all';

        function renderAgents(filtered = agents) {
            grid.innerHTML = '';
            if (filtered.length === 0) {
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';

            filtered.forEach((agent, index) => {
                const card = document.createElement('div');
                card.className = 'agent-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.innerHTML = `
                    <div class="agent-header">
                        <div class="agent-icon">${agent.icon}</div>
                        <div class="agent-info">
                            <div class="agent-id">${agent.id}</div>
                            <div class="agent-name">${agent.name}</div>
                            <span class="agent-phase">${agent.phase}</span>
                        </div>
                    </div>
                    <div class="agent-description">${agent.description}</div>
                    <div class="agent-tools">
                        ${agent.tools.map(tool => `<span class="tool-tag">${tool}</span>`).join('')}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterAgents() {
            let filtered = agents;

            if (currentFilter !== 'all') {
                filtered = filtered.filter(a => a.category === currentFilter);
            }

            const search = searchInput.value.toLowerCase();
            if (search) {
                filtered = filtered.filter(a =>
                    a.id.toLowerCase().includes(search) ||
                    a.name.toLowerCase().includes(search) ||
                    a.description.toLowerCase().includes(search)
                );
            }

            renderAgents(filtered);
        }

        searchInput.addEventListener('input', filterAgents);

        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                filterAgents();
            });
        });

        // Initial render
        renderAgents();
    </script>
</body>
</html>
